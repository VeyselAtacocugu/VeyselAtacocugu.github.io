<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bağlantı</title><style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.6;color:#161412;background:#F1EADC}code{display:block;word-break:break-all;background:#fff;padding:12px;border:2px solid #161412}</style></head><body><h1>Bağlantı tamam</h1><p>Aşağıdaki kodu kopyala ve Claude'a gönder. Bu sayfa hiçbir şeyi kaydetmez.</p><code id="k">—</code><script>var p=new URLSearchParams(location.search);document.getElementById('k').textContent=p.get('code')?('code='+p.get('code')+(p.get('state')?' state='+p.get('state'):'')):(p.get('error')?('hata: '+p.get('error')+' '+(p.get('error_description')||'')):'Kod yok');</script></body></html>
